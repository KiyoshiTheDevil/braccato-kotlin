# What every module publishes under (com.vanniktech.maven.publish). The version is this port's own;
# UPSTREAM.md says which upstream release it carries. Each module adds POM_ARTIFACT_ID, POM_NAME and
# POM_DESCRIPTION in its own gradle.properties.
GROUP=dev.kiyoshi
VERSION_NAME=0.1.0

POM_INCEPTION_YEAR=2026
POM_URL=https://braccato.kiyoshi.dev
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/KiyoshiTheDevil/braccato-kotlin
POM_SCM_CONNECTION=scm:git:git://github.com/KiyoshiTheDevil/braccato-kotlin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/KiyoshiTheDevil/braccato-kotlin.git
POM_DEVELOPER_ID=KiyoshiTheDevil
POM_DEVELOPER_NAME=KiyoshiTheDevil
POM_DEVELOPER_URL=https://github.com/KiyoshiTheDevil

# Upload through the Central Portal and sign what goes there. The credentials and the signing key
# are not here: mavenCentralUsername, mavenCentralPassword and signingInMemoryKey* go in
# ~/.gradle/gradle.properties or the environment (ORG_GRADLE_PROJECT_...), never into the repository.
mavenCentralPublishing=true
signAllPublications=true
