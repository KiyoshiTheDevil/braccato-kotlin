# Builds the documentation site (site/, Astro Starlight) with the API reference (Dokka) under /api/,
# and publishes it to GitHub Pages at braccato.kiyoshi.dev, on each push to main that touches either.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v6
      - name: API reference
        run: ./gradlew dokkaGenerate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Site
        working-directory: site
        run: |
          npm ci
          mkdir -p public/api
          cp -r ../build/dokka/html/. public/api/
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
